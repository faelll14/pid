<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;background:#000;}
#stage.empty{background:#fff;}
#imgView{max-width:100%;max-height:100%;display:none;object-fit:contain;}
#logo{display:none;width:35vw;max-width:400px;}
#fsBtn{position:fixed;bottom:20px;right:20px;z-index:10;background:rgba(255,255,255,.15);color:#fff;border:1px solid #fff;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer;font-family:sans-serif;}
#fsBtn:hover{background:rgba(255,255,255,.3);}
#stage.empty #fsBtn{color:#333;border-color:#333;background:rgba(0,0,0,.05);}
</style>
</head>
<body>
<div id="stage" class="empty">
<img id="logo" src="logo.png">
<img id="imgView">
</div>
<button id="fsBtn">Fullscreen</button>
<script type="module">
import { db, ref, onValue } from "./firebase-config.js";
const stage = document.getElementById('stage');
const imgView = document.getElementById('imgView');
const logo = document.getElementById('logo');
const fsBtn = document.getElementById('fsBtn');
const files = {
  pdf1: "pdfs/poster1.png",
  pdf2: "pdfs/poster2.png",
  pdf3: "pdfs/poster3.png"
};
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
function showEmpty(){
  stage.classList.add('empty');
  imgView.style.display='none';
  logo.style.display='block';
}
function showImage(src){
  stage.classList.remove('empty');
  logo.style.display='none';
  imgView.src = src;
  imgView.style.display='block';
}
let uploadsCache = {};
onValue(ref(db, 'uploads'), (snap) => {
  uploadsCache = snap.val() || {};
  const cur = window.__currentVal;
  if (cur && cur.startsWith('img:')) {
    const key = cur.slice(4);
    const item = uploadsCache[key];
    if (item && item.base64) showImage(item.base64); else showEmpty();
  }
});
onValue(ref(db, 'display/active'), (snap) => {
  const val = snap.val();
  window.__currentVal = val;
  if (val && files[val]) {
    showImage(files[val]);
  } else if (val && val.startsWith('img:')) {
    const key = val.slice(4);
    const item = uploadsCache[key];
    if (item && item.base64) showImage(item.base64); else showEmpty();
  } else {
    showEmpty();
  }
});
</script>
</body>
</html>
