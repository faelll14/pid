<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}
#pdfFrame{width:100%;height:100%;border:none;display:none;}
#empty{color:#fff;font-family:sans-serif;font-size:1.5rem;text-align:center;}
</style>
</head>
<body>
<div id="stage">
<div id="empty">Menunggu tampilan...</div>
<iframe id="pdfFrame"></iframe>
</div>
<script type="module">
import { db, ref, onValue } from "./firebase-config.js";
const frame = document.getElementById('pdfFrame');
const empty = document.getElementById('empty');
const files = {
  pdf1: "pdfs/pdf1.pdf",
  pdf2: "pdfs/pdf2.pdf",
  pdf3: "pdfs/pdf3.pdf"
};
onValue(ref(db, 'display/active'), (snap) => {
  const val = snap.val();
  if (val && files[val]) {
    frame.src = files[val] + "#toolbar=0&navpanes=0&view=Fit";
    frame.style.display = 'block';
    empty.style.display = 'none';
  } else {
    frame.style.display = 'none';
    empty.style.display = 'block';
  }
});
</script>
</body>
</html>
