<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Display</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;}
#stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;position:relative;}
#pdfFrame{width:100%;height:100%;border:none;display:none;}
#imgView{max-width:100%;max-height:100%;display:none;margin:auto;}
#empty{color:#fff;font-family:sans-serif;font-size:1.5rem;text-align:center;}
#fsBtn{position:fixed;bottom:20px;right:20px;z-index:10;background:rgba(255,255,255,.15);color:#fff;border:1px solid #fff;border-radius:8px;padding:10px 16px;font-size:1rem;cursor:pointer;font-family:sans-serif;}
#fsBtn:hover{background:rgba(255,255,255,.3);}
</style>
</head>
<body>
<div id="stage">
<div id="empty">Menunggu tampilan...</div>
<iframe id="pdfFrame"></iframe>
<img id="imgView">
</div>
<button id="fsBtn">Fullscreen</button>
<script type="module">
import { db, ref, onValue } from "./firebase-config.js";
const frame = document.getElementById('pdfFrame');
const imgView = document.getElementById('imgView');
const empty = document.getElementById('empty');
const fsBtn = document.getElementById('fsBtn');
const files = {
  pdf1: "pdfs/pdf1.pdf",
  pdf2: "pdfs/pdf2.pdf",
  pdf3: "pdfs/pdf3.pdf"
};
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
});
function showNone(){
  frame.style.display='none';
  imgView.style.display='none';
  empty.style.display='block';
}
onValue(ref(db, 'display/active'), (snap) => {
  const val = snap.val();
  if (val && files[val]) {
    frame.src = files[val] + "#toolbar=0&navpanes=0&view=Fit";
    frame.style.display = 'block';
    imgView.style.display = 'none';
    empty.style.display = 'none';
  } else if (val && val.startsWith('img:')) {
    const key = val.slice(4);
    onValue(ref(db, 'uploads/' + key), (isnap) => {
      const data = isnap.val();
      if (data && data.base64) {
        imgView.src = data.base64;
        imgView.style.display = 'block';
        frame.style.display = 'none';
        empty.style.display = 'none';
      } else {
        showNone();
      }
    }, { onlyOnce: true });
  } else {
    showNone();
  }
});
</script>
</body>
</html>
